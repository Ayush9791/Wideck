name: Build and publish WiDeck v1.1.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v1.1.1.yml'

permissions:
  contents: write

env:
  WIDECK_VERSION: v1.1.1

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure stable Android signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wideck-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/wideck-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: android
        run: gradle assembleRelease
      - name: Build debug APK (release signing not configured)
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        working-directory: android
        run: gradle assembleDebug
      - name: Name Android APK
        shell: bash
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "WiDeck-Android-$WIDECK_VERSION.apk"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "WiDeck-Android-$WIDECK_VERSION.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: WiDeck-Android-APK
          path: WiDeck-Android-${{ env.WIDECK_VERSION }}.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r windows/requirements.txt
      - name: Build Windows application
        working-directory: windows
        run: python -m PyInstaller --noconfirm --onedir --windowed --name WiDeck app.py
      - name: Package Windows ZIP
        shell: pwsh
        run: Compress-Archive -Path windows/dist/WiDeck -DestinationPath "WiDeck-Windows-${env:WIDECK_VERSION}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: WiDeck-Windows-ZIP
          path: WiDeck-Windows-${{ env.WIDECK_VERSION }}.zip
          if-no-files-found: error

  publish:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: WiDeck-*
          merge-multiple: true
          path: release-assets
      - name: Create release and attach build assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$WIDECK_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$WIDECK_VERSION" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$WIDECK_VERSION" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target main \
              --title "WiDeck $WIDECK_VERSION" \
              --notes "WiDeck Android and Windows builds. Android update compatibility requires a persistent release keystore configured through the ANDROID_KEYSTORE_* repository secrets. If those secrets are absent, this release contains a debug-signed APK that may not update an existing installation."
          fi
