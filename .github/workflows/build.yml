name: Build and release WiDeck

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug
      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "WiDeck-Android-v1.0.2.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: WiDeck-Android-APK
          path: WiDeck-Android-v1.0.2.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r windows/requirements.txt
      - name: Build directory-based EXE
        working-directory: windows
        run: python -m PyInstaller --noconfirm --onedir --windowed --name WiDeck app.py
      - name: Package Windows build
        shell: pwsh
        run: Compress-Archive -Path windows/dist/WiDeck -DestinationPath WiDeck-Windows-v1.0.2.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WiDeck-Windows-ZIP
          path: WiDeck-Windows-v1.0.2.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: WiDeck-*
          merge-multiple: true
          path: release-assets
      - name: Publish v1.0.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v1.0.2" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.0.2 already exists; keeping the existing release immutable."
            exit 0
          fi
          gh release create "v1.0.2" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "WiDeck v1.0.2 (Windows false-positive mitigation)" \
            --notes "Windows packaging change: replaced PyInstaller one-file executable with a directory-based build distributed as ZIP. This can reduce heuristic false positives but does not guarantee antivirus or SmartScreen approval. The Windows build is unsigned; download only from this official repository and scan it with your antivirus before running."
