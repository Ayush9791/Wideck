name: Build and release WiDeck

on:
  workflow_dispatch:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

env:
  WIDECK_VERSION: ${{ github.event.release.tag_name || 'v1.0.2' }}

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure stable Android signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wideck-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/wideck-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: android
        run: gradle assembleRelease
      - name: Build debug APK (until release signing is configured)
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        working-directory: android
        run: gradle assembleDebug
      - name: Name APK
        shell: bash
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "WiDeck-Android-$WIDECK_VERSION.apk"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "WiDeck-Android-$WIDECK_VERSION.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: WiDeck-Android-APK
          path: WiDeck-Android-${{ env.WIDECK_VERSION }}.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r windows/requirements.txt
      - name: Build directory-based EXE
        working-directory: windows
        run: python -m PyInstaller --noconfirm --onedir --windowed --name WiDeck app.py
      - name: Package Windows build
        shell: pwsh
        run: Compress-Archive -Path windows/dist/WiDeck -DestinationPath "WiDeck-Windows-$env:WIDECK_VERSION.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: WiDeck-Windows-ZIP
          path: WiDeck-Windows-${{ env.WIDECK_VERSION }}.zip
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' || github.event_name == 'release'
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: WiDeck-*
          merge-multiple: true
          path: release-assets
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            if gh release view "$WIDECK_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $WIDECK_VERSION already exists; assets were built but the release was not overwritten."
              exit 0
            fi
            gh release create "$WIDECK_VERSION" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "WiDeck $WIDECK_VERSION" \
              --notes "Release assets for Windows and Android. Configure the ANDROID_KEYSTORE_* repository secrets for stable signed Android updates. Unsigned/untrusted builds may require manual installation and should only be downloaded from this official repository."
          fi
