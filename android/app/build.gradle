plugins { id 'com.android.application' }

def releaseVersion = (System.getenv("WIDECK_VERSION") ?: "1.0.0").replaceFirst("^[vV]", "")
def versionParts = releaseVersion.tokenize(".").collect { it.toInteger() }
while (versionParts.size() < 3) versionParts.add(0)
def computedVersionCode = versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]

android {
    namespace 'com.ayush.wideck'
    compileSdk 35
    defaultConfig {
        applicationId 'com.ayush.wideck'
        minSdk 26
        targetSdk 28
        versionCode computedVersionCode
        versionName releaseVersion
    }

    def storePath = System.getenv("ANDROID_KEYSTORE_PATH")
    def storePasswordValue = System.getenv("ANDROID_KEYSTORE_PASSWORD")
    def keyAliasValue = System.getenv("ANDROID_KEY_ALIAS")
    def keyPasswordValue = System.getenv("ANDROID_KEY_PASSWORD")

    if (storePath && storePasswordValue && keyAliasValue && keyPasswordValue) {
        signingConfigs {
            release {
                storeFile file(storePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.release
                minifyEnabled false
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.work:work-runtime:2.9.1'
}
